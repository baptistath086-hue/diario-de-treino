<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diário de Treino</title>
<style>
:root{
  --bg:#0E2925; --panel:#173832; --ink:#F5EEE1; --sub:#A9BEB6;
  --line:#2C4B44; --accent:#C1613A; --accent-ink:#FFF7EE;
  --coral:#E3B873; --warn:#E37A5C; --chip:#1E453E;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E2925; --panel:#173832; --ink:#F5EEE1; --sub:#A9BEB6;
    --line:#2C4B44; --accent:#D06E43; --accent-ink:#FFF7EE; --coral:#E8C280; --chip:#1E453E;
  }
}
:root[data-theme="dark"]{
  --bg:#0E2925; --panel:#173832; --ink:#F5EEE1; --sub:#A9BEB6;
  --line:#2C4B44; --accent:#D06E43; --accent-ink:#FFF7EE; --coral:#E8C280; --chip:#1E453E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Inter","Helvetica Neue",Arial,sans-serif;
  min-height:100%;
}
h1,h2,.num{font-family:"Georgia","Iowan Old Style",serif}
header{
  padding:1.1rem 1.2rem .9rem; padding-top:calc(1.1rem + env(safe-area-inset-top,0px));
  display:flex; align-items:center; gap:.6rem;
}
header .logo{
  width:38px; height:38px; border-radius:11px; background:var(--coral);
  color:#FFFFFF; display:flex; align-items:center; justify-content:center;
  font-size:1.2rem; flex:0 0 auto;
}
header h1{margin:0; font-size:1.2rem; font-weight:700; font-family:"Inter",sans-serif; letter-spacing:-.01em}
header p{margin:0; color:var(--sub); font-size:.78rem}
nav{
  display:flex; gap:0; background:var(--panel);
  position:fixed; left:0; right:0; bottom:0; z-index:5;
  padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -1px 0 var(--line), 0 -6px 16px -8px rgba(0,0,0,.18);
}
nav button{
  flex:1 1 0; padding:.55rem .3rem .6rem; background:none; border:none; color:var(--sub);
  font-size:.68rem; font-family:inherit; cursor:pointer; white-space:nowrap;
  touch-action:manipulation; min-height:56px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.15rem;
}
nav button .ic{font-size:1.25rem; line-height:1}
nav button.active{color:var(--accent); font-weight:700}
main{max-width:760px; margin:0 auto; padding:1rem; padding-bottom:6rem}
section{display:none}
section.active{display:block; animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:1.1rem; margin-bottom:.9rem;
}
.card h2{font-size:1rem; margin:0 0 .9rem; font-weight:700; font-family:"Inter",sans-serif}
.row{display:flex; flex-wrap:wrap; gap:.6rem; margin-bottom:.7rem}
.field{flex:1 1 130px; display:flex; flex-direction:column; gap:.3rem}
.field label{font-size:.72rem; color:var(--sub); font-weight:600}
input,select{
  font-family:inherit; font-size:1rem; padding:.65rem .7rem; border:1px solid var(--line);
  border-radius:10px; background:var(--bg); color:var(--ink); width:100%;
}
button.primary{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
  padding:.85rem 1.1rem; font-size:.95rem; font-weight:700; cursor:pointer; font-family:inherit;
  width:100%; touch-action:manipulation; min-height:48px;
}
button.ghost{
  background:none; border:1px solid var(--line); color:var(--sub); border-radius:10px;
  padding:.5rem .8rem; font-size:.78rem; cursor:pointer; font-family:inherit; min-height:40px;
}
table{width:100%; border-collapse:collapse; font-size:.85rem; margin-top:.4rem}
th{text-align:left; color:var(--sub); font-weight:600; font-size:.7rem; padding:.4rem .45rem; border-bottom:1px solid var(--line)}
td{padding:.5rem .45rem; border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
.empty{color:var(--sub); font-size:.85rem; padding:.6rem 0}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.7rem}
.stat{background:var(--chip); border-radius:12px; padding:.9rem}
.stat .num{font-size:1.6rem; line-height:1; color:var(--coral)}
.stat .lbl{font-size:.72rem; color:var(--sub); margin-top:.25rem}
.overflow{overflow-x:auto}
svg text{font-family:"Inter",sans-serif}
.hint{font-size:.75rem; color:var(--sub); margin-top:.3rem}
</style>
</head>
<body>
<header>
  <div class="logo">💪</div>
  <div><h1>Diário de Treino</h1>
  <p>Salvo só neste aparelho</p></div>
</header>
<nav id="tabs">
  <button data-t="treino" class="active"><span class="ic">🏋️</span>Treino</button>
  <button data-t="cargas"><span class="ic">📈</span>Carga</button>
  <button data-t="medidas"><span class="ic">📏</span>Medidas</button>
  <button data-t="habitos"><span class="ic">💧</span>Hábitos</button>
  <button data-t="resumo"><span class="ic">📊</span>Resumo</button>
</nav>
<main>

<section id="treino" class="active">
  <div class="card">
    <h2>🏋️ Novo item de treino</h2>
    <div class="row">
      <div class="field"><label>Dia</label>
        <select id="tr-dia"><option>Segunda</option><option>Terça</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sábado</option><option>Domingo</option></select></div>
      <div class="field"><label>Exercício</label><input id="tr-ex" placeholder="Agachamento"></div>
      <div class="field"><label>Séries</label><input id="tr-s" type="number" placeholder="3"></div>
      <div class="field"><label>Repetições</label><input id="tr-r" type="number" placeholder="12"></div>
      <div class="field"><label>Carga (kg)</label><input id="tr-c" type="number" placeholder="20"></div>
    </div>
    <button class="primary" id="btn-add-treino" type="button">Adicionar</button>
  </div>
  <div class="card">
    <h2>Semana atual</h2>
    <div id="treino-list"></div>
  </div>
</section>

<section id="cargas">
  <div class="card">
    <h2>📈 Registrar série</h2>
    <div class="row">
      <div class="field"><label>Data</label><input id="ca-data" type="date"></div>
      <div class="field"><label>Exercício</label><input id="ca-ex" placeholder="Agachamento"></div>
      <div class="field"><label>Repetições</label><input id="ca-r" type="number" placeholder="12"></div>
      <div class="field"><label>Carga (kg)</label><input id="ca-c" type="number" placeholder="20"></div>
    </div>
    <button class="primary" id="btn-add-carga" type="button">Adicionar</button>
  </div>
  <div class="card">
    <h2>Histórico</h2>
    <div id="carga-list"></div>
  </div>
</section>

<section id="medidas">
  <div class="card">
    <h2>📏 Novo registro</h2>
    <div class="row">
      <div class="field"><label>Data</label><input id="me-data" type="date"></div>
      <div class="field"><label>Peso (kg)</label><input id="me-p" type="number" step="0.1" placeholder="70"></div>
      <div class="field"><label>Cintura (cm)</label><input id="me-ci" type="number" step="0.1" placeholder="80"></div>
      <div class="field"><label>Peito/Tórax (cm)</label><input id="me-peito" type="number" step="0.1" placeholder="100"></div>
      <div class="field"><label>Quadril (cm)</label><input id="me-quad" type="number" step="0.1" placeholder="100"></div>
      <div class="field"><label>Braço direito (cm)</label><input id="me-bd" type="number" step="0.1" placeholder="35"></div>
      <div class="field"><label>Braço esquerdo (cm)</label><input id="me-be" type="number" step="0.1" placeholder="35"></div>
      <div class="field"><label>Coxa direita (cm)</label><input id="me-cd" type="number" step="0.1" placeholder="55"></div>
      <div class="field"><label>Coxa esquerda (cm)</label><input id="me-ce" type="number" step="0.1" placeholder="55"></div>
      <div class="field"><label>Panturrilha direita (cm)</label><input id="me-pd" type="number" step="0.1" placeholder="38"></div>
      <div class="field"><label>Panturrilha esquerda (cm)</label><input id="me-pe" type="number" step="0.1" placeholder="38"></div>
    </div>
    <button class="primary" id="btn-add-medida" type="button">Adicionar</button>
  </div>
  <div class="card">
    <h2>Evolução do peso</h2>
    <div id="chart-wrap"></div>
    <div id="medida-list"></div>
  </div>
</section>

<section id="habitos">
  <div class="card">
    <h2>💧 Hoje</h2>
    <div class="row">
      <div class="field"><label>Data</label><input id="ha-data" type="date"></div>
      <div class="field"><label>Água (L)</label><input id="ha-agua" type="number" step="0.1" placeholder="2"></div>
      <div class="field"><label>Sono (h)</label><input id="ha-sono" type="number" step="0.1" placeholder="7.5"></div>
      <div class="field"><label>Treinou?</label><select id="ha-tr"><option>Sim</option><option>Não</option></select></div>
      <div class="field"><label>Energia (1-5)</label><input id="ha-en" type="number" min="1" max="5" placeholder="4"></div>
    </div>
    <button class="primary" id="btn-add-habito" type="button">Adicionar</button>
  </div>
  <div class="card">
    <h2>Histórico</h2>
    <div id="habito-list"></div>
  </div>
</section>

<section id="resumo">
  <div class="card">
    <h2>📊 Mês analisado</h2>
    <div class="row">
      <div class="field" style="max-width:200px"><label>Escolha o mês</label><input id="re-mes" type="month"></div>
    </div>
  </div>
  <div class="card">
    <h2>Resultados do mês</h2>
    <div id="resumo-stats" class="stat-grid"></div>
  </div>
  <div class="card">
    <h2>Dados</h2>
    <button class="ghost" id="btn-reset" type="button">Apagar todos os dados deste navegador</button>
  </div>
</section>

</main>

<script>
const KEY='diario_treino_v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{treino:[],cargas:[],medidas:[],habitos:[]}; }catch(e){ return {treino:[],cargas:[],medidas:[],habitos:[]}; } }
function save(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)); }catch(e){} }
let data = load();

document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(btn.dataset.t).classList.add('active');
  if(btn.dataset.t==='resumo') renderResumo();
});

function todayStr(){ return new Date().toISOString().slice(0,10); }
['ca-data','me-data','ha-data'].forEach(id=>{
  const el=document.getElementById(id); if(el) el.value=todayStr();
});
document.getElementById('re-mes').value = todayStr().slice(0,7);

function addTreino(){
  const dia=document.getElementById('tr-dia').value;
  const ex=document.getElementById('tr-ex').value.trim();
  const s=document.getElementById('tr-s').value;
  const r=document.getElementById('tr-r').value;
  const c=document.getElementById('tr-c').value;
  if(!ex){ alert('Escreva o nome do exercício.'); return; }
  data.treino.push({dia,ex,s,r,c});
  save(data); document.getElementById('tr-ex').value=''; renderTreino();
}
function renderTreino(){
  const box=document.getElementById('treino-list');
  if(!data.treino.length){ box.innerHTML='<div class="empty">Nenhum exercício ainda. Adicione o primeiro acima.</div>'; return; }
  let h='<div class="overflow"><table><tr><th>Dia</th><th>Exercício</th><th>Séries</th><th>Reps</th><th>Carga</th><th></th></tr>';
  data.treino.forEach((t,i)=>{
    h+=`<tr><td>${t.dia}</td><td>${t.ex}</td><td>${t.s||'-'}</td><td>${t.r||'-'}</td><td>${t.c||'-'} kg</td><td><button class="ghost" data-del="treino,${i}">Remover</button></td></tr>`;
  });
  box.innerHTML=h+'</table></div>';
}

function addCarga(){
  const dt=document.getElementById('ca-data').value||todayStr();
  const ex=document.getElementById('ca-ex').value.trim();
  const r=parseFloat(document.getElementById('ca-r').value);
  const c=parseFloat(document.getElementById('ca-c').value);
  if(!ex||!r||!c){ alert('Preencha exercício, repetições e carga.'); return; }
  data.cargas.push({dt,ex,r,c,vol:r*c});
  save(data); document.getElementById('ca-ex').value=''; document.getElementById('ca-r').value=''; document.getElementById('ca-c').value='';
  renderCargas();
}
function renderCargas(){
  const box=document.getElementById('carga-list');
  const list=[...data.cargas].sort((a,b)=>b.dt.localeCompare(a.dt));
  if(!list.length){ box.innerHTML='<div class="empty">Nenhuma série registrada ainda.</div>'; return; }
  let h='<div class="overflow"><table><tr><th>Data</th><th>Exercício</th><th>Reps</th><th>Carga</th><th>Volume</th><th></th></tr>';
  list.forEach((t)=>{
    const i=data.cargas.indexOf(t);
    h+=`<tr><td>${fmtDate(t.dt)}</td><td>${t.ex}</td><td>${t.r}</td><td>${t.c} kg</td><td>${t.vol} kg</td><td><button class="ghost" data-del="cargas,${i}">Remover</button></td></tr>`;
  });
  box.innerHTML=h+'</table></div>';
}

function addMedida(){
  const dt=document.getElementById('me-data').value||todayStr();
  const p=parseFloat(document.getElementById('me-p').value);
  const ci=parseFloat(document.getElementById('me-ci').value);
  const peito=parseFloat(document.getElementById('me-peito').value)||null;
  const quad=parseFloat(document.getElementById('me-quad').value)||null;
  const bd=parseFloat(document.getElementById('me-bd').value)||null;
  const be=parseFloat(document.getElementById('me-be').value)||null;
  const cd=parseFloat(document.getElementById('me-cd').value)||null;
  const ce=parseFloat(document.getElementById('me-ce').value)||null;
  const pd=parseFloat(document.getElementById('me-pd').value)||null;
  const pe=parseFloat(document.getElementById('me-pe').value)||null;
  if(!p){ alert('Informe o peso.'); return; }
  data.medidas.push({dt,p,ci,peito,quad,bd,be,cd,ce,pd,pe});
  data.medidas.sort((a,b)=>a.dt.localeCompare(b.dt));
  save(data);
  ['me-p','me-ci','me-peito','me-quad','me-bd','me-be','me-cd','me-ce','me-pd','me-pe'].forEach(id=>document.getElementById(id).value='');
  renderMedidas();
}
function renderMedidas(){
  drawChart();
  const box=document.getElementById('medida-list');
  const list=[...data.medidas].sort((a,b)=>b.dt.localeCompare(a.dt));
  if(!list.length){ box.innerHTML='<div class="empty">Nenhum registro ainda.</div>'; return; }
  let h='<div class="overflow"><table><tr><th>Data</th><th>Peso</th><th>Cintura</th><th>Peito</th><th>Quadril</th><th>Braço D</th><th>Braço E</th><th>Coxa D</th><th>Coxa E</th><th>Pant. D</th><th>Pant. E</th><th></th></tr>';
  list.forEach((t)=>{
    const i=data.medidas.indexOf(t);
    h+=`<tr><td>${fmtDate(t.dt)}</td><td>${t.p} kg</td><td>${t.ci||'-'} cm</td><td>${t.peito||'-'} cm</td><td>${t.quad||'-'} cm</td><td>${t.bd||'-'} cm</td><td>${t.be||'-'} cm</td><td>${t.cd||'-'} cm</td><td>${t.ce||'-'} cm</td><td>${t.pd||'-'} cm</td><td>${t.pe||'-'} cm</td><td><button class="ghost" data-del="medidas,${i}">Remover</button></td></tr>`;
  });
  box.innerHTML=h+'</table></div>';
}
function drawChart(){
  const wrap=document.getElementById('chart-wrap');
  const pts=[...data.medidas].sort((a,b)=>a.dt.localeCompare(b.dt));
  if(pts.length<2){ wrap.innerHTML='<div class="hint">Adicione ao menos 2 registros para ver o gráfico.</div>'; return; }
  const W=640,H=160,pad=28;
  const ws=pts.map(p=>p.p);
  const min=Math.min(...ws), max=Math.max(...ws);
  const span=(max-min)||1;
  const x=i=> pad + i*(W-2*pad)/(pts.length-1);
  const y=v=> H-pad - (v-min)/span*(H-2*pad);
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.p).toFixed(1)}`).join(' ');
  const ink=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#5C7A52';
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">`;
  svg+=`<path d="${line}" fill="none" stroke="${ink}" stroke-width="2.5"/>`;
  const dotColor = getComputedStyle(document.documentElement).getPropertyValue('--coral').trim()||'#FF6B54';
  pts.forEach((p,i)=>{ svg+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.p).toFixed(1)}" r="3.5" fill="${dotColor}"/>`; });
  svg+=`<text x="${pad}" y="14" font-size="11" fill="var(--sub)">${max} kg</text>`;
  svg+=`<text x="${pad}" y="${H-14}" font-size="11" fill="var(--sub)">${min} kg</text>`;
  svg+='</svg>';
  wrap.innerHTML=svg;
}

function addHabito(){
  const dt=document.getElementById('ha-data').value||todayStr();
  const agua=parseFloat(document.getElementById('ha-agua').value)||0;
  const sono=parseFloat(document.getElementById('ha-sono').value)||0;
  const tr=document.getElementById('ha-tr').value;
  const en=parseInt(document.getElementById('ha-en').value)||null;
  data.habitos.push({dt,agua,sono,tr,en});
  save(data); renderHabitos();
}
function renderHabitos(){
  const box=document.getElementById('habito-list');
  const list=[...data.habitos].sort((a,b)=>b.dt.localeCompare(a.dt));
  if(!list.length){ box.innerHTML='<div class="empty">Nenhum dia registrado ainda.</div>'; return; }
  let h='<div class="overflow"><table><tr><th>Data</th><th>Água</th><th>Sono</th><th>Treinou</th><th>Energia</th><th></th></tr>';
  list.forEach((t)=>{
    const i=data.habitos.indexOf(t);
    h+=`<tr><td>${fmtDate(t.dt)}</td><td>${t.agua} L</td><td>${t.sono} h</td><td>${t.tr}</td><td>${t.en||'-'}</td><td><button class="ghost" data-del="habitos,${i}">Remover</button></td></tr>`;
  });
  box.innerHTML=h+'</table></div>';
}

function delItem(cat,i){ data[cat].splice(i,1); save(data);
  if(cat==='treino')renderTreino(); if(cat==='cargas')renderCargas();
  if(cat==='medidas')renderMedidas(); if(cat==='habitos')renderHabitos();
}
function fmtDate(s){ const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }

document.getElementById('re-mes').addEventListener('change', renderResumo);
function renderResumo(){
  const ym=document.getElementById('re-mes').value;
  const box=document.getElementById('resumo-stats');
  if(!ym){ box.innerHTML=''; return; }
  const hab=data.habitos.filter(h=>h.dt.startsWith(ym));
  const car=data.cargas.filter(c=>c.dt.startsWith(ym));
  const med=[...data.medidas].sort((a,b)=>a.dt.localeCompare(b.dt));
  const dias=hab.length;
  const treinos=hab.filter(h=>h.tr==='Sim').length;
  const aguaMed = dias? (hab.reduce((s,h)=>s+h.agua,0)/dias).toFixed(1):'-';
  const sonoMed = dias? (hab.reduce((s,h)=>s+h.sono,0)/dias).toFixed(1):'-';
  const vol = car.reduce((s,c)=>s+c.vol,0);
  const pesoIni = med.length? med[0].p : null;
  const pesoAtual = med.length? med[med.length-1].p : null;
  const varPeso = (pesoIni!==null && pesoAtual!==null) ? (pesoAtual-pesoIni).toFixed(1) : null;
  const stats=[
    ['Dias registrados', dias],
    ['Treinos feitos', treinos],
    ['Água média/dia', aguaMed+' L'],
    ['Sono médio/noite', sonoMed+' h'],
    ['Volume levantado no mês', vol+' kg'],
    ['Peso atual', pesoAtual!==null? pesoAtual+' kg':'-'],
    ['Variação de peso (total)', varPeso!==null? (varPeso>0?'+':'')+varPeso+' kg':'-'],
  ];
  box.innerHTML = stats.map(s=>`<div class="stat"><div class="num">${s[1]}</div><div class="lbl">${s[0]}</div></div>`).join('');
}

function resetAll(){
  if(confirm('Isso vai apagar todos os dados salvos neste navegador. Confirmar?')){
    data={treino:[],cargas:[],medidas:[],habitos:[]}; save(data);
    renderTreino(); renderCargas(); renderMedidas(); renderHabitos(); renderResumo();
  }
}

document.getElementById('btn-add-treino').addEventListener('click', addTreino);
document.getElementById('btn-add-carga').addEventListener('click', addCarga);
document.getElementById('btn-add-medida').addEventListener('click', addMedida);
document.getElementById('btn-add-habito').addEventListener('click', addHabito);
document.getElementById('btn-reset').addEventListener('click', resetAll);
document.querySelector('main').addEventListener('click', function(e){
  var b = e.target.closest('[data-del]');
  if(!b) return;
  var parts = b.getAttribute('data-del').split(',');
  delItem(parts[0], parseInt(parts[1]));
});

renderTreino(); renderCargas(); renderMedidas(); renderHabitos(); renderResumo();
</script>
</body>
</html>
